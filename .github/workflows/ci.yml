name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://atlas:atlas@localhost:5432/atlas_test' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  container:
    name: Docker image smoke test (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build image
        run: docker build -t atlas:ci .
      - name: Start container in production mode
        run: |
          docker run -d --name atlas --network host \
            -e PORT=8000 \
            -e SEED_CATALOG_ON_START=1 \
            -e DATABASE_URL=postgresql://atlas:atlas@localhost:5432/atlas \
            -e RENDER_GIT_COMMIT=${{ github.sha }} \
            atlas:ci
      - name: Smoke test
        run: python scripts/smoke_test.py http://127.0.0.1:8000 --expect-dialect postgresql --wake-timeout 60
      - name: Restart container (re-runs migrations and the idempotent seed)
        run: |
          docker restart atlas
          python scripts/smoke_test.py http://127.0.0.1:8000 --expect-dialect postgresql --wake-timeout 60
          test "$(docker logs atlas 2>&1 | grep -c '"catalogue seed complete"')" -eq 2
      - name: Production refuses SQLite
        run: |
          if docker run --rm -e DATABASE_URL=sqlite:///tmp/x.db atlas:ci; then
            echo "expected startup failure with SQLite in production"; exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs atlas || true
